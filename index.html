<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f8faf8">
    <meta
      name="description"
      content="Aklında Dursun uygulamasının resmi destek sitesi."
    >
    <title>Aklında Dursun</title>
    <style>
      :root {
        color: #18201b;
        background: #f8faf8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        line-height: 1.6;
      }

      main {
        width: min(100% - 2rem, 720px);
        padding: 4rem 0;
        text-align: center;
      }

      .mark {
        display: grid;
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.5rem;
        place-items: center;
        border-radius: 1.15rem;
        color: #ffffff;
        background: #39744e;
        font-size: 2rem;
        font-weight: 700;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 8vw, 3.5rem);
        line-height: 1.15;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0 0 2rem;
        color: #465149;
        font-size: 1.1rem;
      }

      a {
        display: inline-block;
        padding: 0.75rem 1.25rem;
        border-radius: 0.8rem;
        color: #ffffff;
        background: #39744e;
        font-weight: 650;
        text-decoration: none;
      }

      a:hover {
        background: #2f6241;
      }

      a:focus-visible {
        outline: 3px solid #18201b;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">A</div>
      <h1>Aklında Dursun</h1>
      <p>Hatırlatıcılarınızı düzenlemenize ve önemli işlerinizi takip etmenize yardımcı olur.</p>
      <a href="support/">Destek</a>
    </main>
  </body>
</html>
